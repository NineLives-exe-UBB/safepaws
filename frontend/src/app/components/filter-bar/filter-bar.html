<form class="filter-bar" [formGroup]="form" (submit)="$event.preventDefault()">
  <div class="field">
    <label for="filter-type">Type</label>
    <select id="filter-type" formControlName="type">
      <option value="">Any</option>
      @for (option of typeOptions; track option[0]) {
        <option [value]="option[0]">{{ option[1] }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label for="filter-species">Species</label>
    <select id="filter-species" formControlName="species">
      <option value="">Any</option>
      @for (option of speciesOptions; track option[0]) {
        <option [value]="option[0]">{{ option[1] }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label for="filter-status">Status</label>
    <select id="filter-status" formControlName="status">
      <option value="">Any</option>
      @for (option of statusOptions; track option[0]) {
        <option [value]="option[0]">{{ option[1] }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label for="filter-color">Color</label>
    <input id="filter-color" type="text" formControlName="color" placeholder="e.g. grey" />
  </div>

  <div class="field">
    <label for="filter-breed">Breed</label>
    <input id="filter-breed" type="text" formControlName="breed" placeholder="e.g. European" />
  </div>

  <div class="field">
    <label for="filter-area">Area</label>
    <input id="filter-area" type="text" formControlName="area" placeholder="e.g. Mănăștur" />
  </div>

  <div class="field">
    <label for="filter-radius">Radius</label>
    <select id="filter-radius" formControlName="radiusKm">
      <option [ngValue]="null">Any distance</option>
      @for (radius of radiusOptions; track radius) {
        <option [ngValue]="radius">Within {{ radius }} km</option>
      }
    </select>
  </div>

  <div class="field">
    <label for="filter-sort">Sort by</label>
    <select id="filter-sort" formControlName="sort">
      @for (option of sortOptions; track option[0]) {
        <option [value]="option[0]" [disabled]="option[0] === 'NEAREST' && !locationAvailable()">
          {{ option[1] }}
        </option>
      }
    </select>
  </div>

  @if (hasActiveFilters()) {
    <button type="button" class="clear-button" (click)="clearFilters()">Clear filters</button>
  }

  @if (locationStatus() === 'denied') {
    <p class="location-message">Allow location access to see announcements near you</p>
  }
</form>
