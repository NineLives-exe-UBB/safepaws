
<header class="header">
  <a class="brand" routerLink="/announcements">SafePaws</a>

  <nav class="nav">
    <a
      routerLink="/announcements"
      routerLinkActive="active"
      [routerLinkActiveOptions]="listLinkOptions"
    >
      Announcements
    </a>

    <a routerLink="/map" routerLinkActive="active">Map</a>

    @if (auth.isLoggedIn()) {
      <a routerLink="/announcements/new" routerLinkActive="active">
        Post announcement
      </a>

      <span class="user-name">{{ auth.user()?.displayName }}</span>

      <button type="button" class="logout-button" (click)="logout()">
        Log out
      </button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Log in</a>
      <a routerLink="/register" routerLinkActive="active">Register</a>
    }
  </nav>
</header>
