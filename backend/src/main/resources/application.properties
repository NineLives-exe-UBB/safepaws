spring.application.name=safepaws

# Import .env from either backend/ or project root (../.env)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:safepaws}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & JPA (validate schema created by Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Multipart File Upload Limits (Photos up to 5MB, total request 25MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# CORS: frontend origins allowed to call the API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Frontend address used in the poster QR code (use the laptop's IP to scan it from a phone)
app.frontend.base-url=${FRONTEND_URL:http://localhost:4200}