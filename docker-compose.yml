services:
  postgres:
    image: postgres:17
    container_name: safepaws-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-safepaws}
      POSTGRES_USER: ${DB_USER:-safepaws}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - copy .env.example to .env and fill it in}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
